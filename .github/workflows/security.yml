name: Security learning pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: SCA using Trivy (learning mode; findings retained, not a release gate)
        run: bash scripts/scan.sh sca
      - name: CycloneDX SBOM using Syft
        if: always()
        run: bash scripts/scan.sh sbom
      - name: DAST using ZAP (own ephemeral loopback app only)
        if: always()
        run: bash scripts/scan.sh dast
      - name: Prepare local review packet (no AI API calls)
        if: always()
        run: python scripts/review_packet.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-learning-reports
          path: reports/
          retention-days: 7
